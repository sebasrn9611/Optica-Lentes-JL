# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

# Nombre de la aplicación.
spring.application.name=backend

# Puerto del backend.
# Si PORT no existe, utiliza 8080.
server.port=${PORT:8080}


# ============================================================================
# CONEXIÓN CON MYSQL
# ============================================================================

# Dirección de la base de datos.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/optica_lentes_jl?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}

# Usuario de MySQL.
# Si DB_USERNAME no existe, utiliza root.
spring.datasource.username=${DB_USERNAME:root}

# Contraseña de MySQL.
# Esta ya NO estará escrita dentro del proyecto.
spring.datasource.password=${DB_PASSWORD}


# ============================================================================
# CONFIGURACIÓN DE JPA E HIBERNATE
# ============================================================================

# Crea o actualiza las tablas basándose en las entidades Java.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL ejecutadas.
spring.jpa.show-sql=true

# Organiza las consultas SQL.
spring.jpa.properties.hibernate.format_sql=true

# Evita mantener abierta la sesión Hibernate durante toda la petición.
spring.jpa.open-in-view=false


# ============================================================================
# CONFIGURACIÓN JWT
# ============================================================================

# Secreto utilizado para firmar los JWT.
# Ahora se obtiene desde una variable de entorno.
app.jwt.secret=${JWT_SECRET}

# Duración del JWT.
# Si no se configura, utilizará 7200 segundos = 2 horas.
app.jwt.expiration=${JWT_EXPIRATION:7200}


# ============================================================================
# ADMINISTRADOR INICIAL
# ============================================================================

app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:Administrador Óptica Lentes J.L.}

# ============================================================================
# CORS
# ============================================================================

# Dirección del frontend autorizado para comunicarse con el backend.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
