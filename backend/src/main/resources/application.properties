# ============================================================================
# GENERAL
# ============================================================================

spring.application.name=backend
server.port=${PORT:8080}

# Evita que Tomcat reutilice una carpeta temporal global creada por otro
# usuario/proceso de Windows. La ruta permanece aislada dentro del backend.
server.tomcat.basedir=${TOMCAT_BASEDIR:./.tomcat}

# La API usa JWT y no sesiones de servidor. Desactivar su persistencia evita
# que DevTools/Tomcat intente acceder a directorios temporales globales.
server.servlet.session.persistent=false


# ============================================================================
# MYSQL
# ============================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/optica_lentes_jl?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD}


# ============================================================================
# JPA / HIBERNATE
# ============================================================================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ============================================================================
# JWT
# ============================================================================

app.jwt.secret=${JWT_SECRET}

app.jwt.expiration=${JWT_EXPIRATION:7200}


# ============================================================================
# ADMINISTRADOR INICIAL
# ============================================================================

app.admin.email=${ADMIN_EMAIL}

app.admin.password=${ADMIN_PASSWORD}

app.admin.name=${ADMIN_NAME:Administrador Optica Lentes J.L.}


# ============================================================================
# CORS
# ============================================================================

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
